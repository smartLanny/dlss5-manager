name: Apply reviewed player release source
on:
  push:
    branches: ['release/beta-0.2']
    paths: ['.github/workflows/materialize-player.yml']
permissions:
  contents: write
concurrency:
  group: apply-reviewed-player-source
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'smartLanny/dlss5-manager' && github.ref == 'refs/heads/release/beta-0.2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public source envelopes and apply exact reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4062999667566c3bf64900455eb4be8ac4ae3640'
          python3 - <<'PY'
          import urllib.request,os,json,base64,lzma,hashlib,pathlib,subprocess
          allowed=set('''.github/workflows/beta.yml
          AGENTS.md
          NOTICE.md
          README.md
          SECURITY.md
          THIRD_PARTY_NOTICES.md
          config/loader-evidence.json
          config/reshade.json
          docs/COMPATIBILITY.md
          docs/DISTRIBUTION.md
          docs/RELEASE-0.2-BETA.md
          package-lock.json
          package.json
          resources/components/catalog.json
          scripts/packaged-smoke.cjs
          scripts/release-files.cjs
          scripts/smoke.cjs
          scripts/stage-components.cjs
          scripts/test-official-runtime.cjs
          src/core/artwork.cjs
          src/core/detection.cjs
          src/core/discovery.cjs
          src/core/engine.cjs
          src/core/feedback.cjs
          src/core/loader-config.cjs
          src/core/loader.cjs
          src/core/network.cjs
          src/core/packages.cjs
          src/core/platform.cjs
          src/core/player.cjs
          src/core/reshade.cjs
          src/core/scanner.cjs
          src/core/stores.cjs
          src/core/wait.cjs
          src/main.cjs
          src/preload.cjs
          src/ui/app.css
          src/ui/app.js
          src/ui/feedback.css
          src/ui/feedback.js
          src/ui/index.html
          test/engine.test.cjs
          test/feedback.test.cjs
          test/player.test.cjs
          test/security.test.cjs'''.splitlines())
          def fetch_blobs(shas):
              chunks=[]
              for sha in shas:
                  req=urllib.request.Request('https://api.github.com/repos/smartLanny/dlss5-manager/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(req,timeout=30) as response: value=json.load(response)
                  assert value['sha']==sha and value['encoding']=='base64'
                  b=base64.b64decode(value['content'])
                  assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
                  chunks.append(b)
              return b''.join(chunks)
          base=fetch_blobs(['bb2f53f09a76aa17065e23e10447e11b26f85ab0','bcd577281934b1c6b7bf48ada5015e2face36fba','d1ecc7ae858b20d342e7b827631e5bb50739853f'])
          decoder=lzma.LZMADecompressor(memlimit=512*1024*1024)
          raw=decoder.decompress(base,max_length=2*1024*1024)
          assert hashlib.sha256(raw).hexdigest()=='94c8b7b98ae29441b5e4cb49258649afa7ac6e71e34f0d69e5398e1349811928'
          # The former interrupted upload contains exactly 34 COMPLETE JSON entries.
          # Ignore the unfinished following entry, replaced by the complete overlay below.
          text=raw.decode('utf-8'); parser=json.JSONDecoder(); pos=1; entries=[]
          while pos<len(text):
              while pos<len(text) and text[pos] in ' \r\n\t,': pos+=1
              try: entry,end=parser.raw_decode(text,pos)
              except json.JSONDecodeError: break
              entries.append(entry); pos=end
          assert len(entries)==34
          overlay=fetch_blobs(['58204058e217e7f9d1a26df86205596c8ea451f2','3462a1bd219dea0ca38905036400d00cf59efdca','120def0a0c3d63af779ac81357d4c5ce28b85824'])
          assert hashlib.sha256(overlay).hexdigest()=='523cde9ca2bd0f43e9510ff0fc592ad2babb07512216498fe57d4bc6c05393e2'
          d=lzma.LZMADecompressor(memlimit=512*1024*1024); patch=d.decompress(overlay,max_length=2*1024*1024)
          assert d.eof and not d.unused_data
          additions=json.loads(patch); assert len(additions)==22
          entries+=additions
          assert {e['file'] for e in entries}==allowed
          for entry in entries:
              name=entry['file']; target=pathlib.Path(name)
              assert name in allowed and not target.is_symlink()
              current=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              assert current==entry['before'], ('Base mismatch',name)
              assert ('patch' in entry) != ('text' in entry)
              if 'patch' in entry:
                  patchfile=pathlib.Path('/tmp/reviewed-single-file.patch'); patchfile.write_text(entry['patch'],encoding='utf-8')
                  stats=subprocess.check_output(['git','apply','--numstat',str(patchfile)],text=True).strip().splitlines()
                  assert len(stats)==1 and stats[0].split('\t')[-1]==name
                  subprocess.run(['git','apply','--check','--whitespace=error',str(patchfile)],check=True)
                  subprocess.run(['git','apply','--whitespace=error',str(patchfile)],check=True)
              else:
                  assert '\x00' not in entry['text']
                  target.parent.mkdir(parents=True,exist_ok=True); target.write_text(entry['text'],encoding='utf-8')
          inventory={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(allowed)}
          aggregate=hashlib.sha256(json.dumps(inventory,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert aggregate=='b36c609a3345422452ba6752b9e3f1d95e86909fb0106f50e9e604ae1a1d5026'
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          for p in ['.github/workflows/materialize-player.yml','.github/workflows/recover-staged-review.yml']:
              subprocess.run(['git','rm','--',p],check=True)
          print('Verified 45 exact reviewed public source files; no NR binaries, private sources or credentials.')
          PY
          git diff --cached --check
          npm run check
          npm test
      - name: Commit reviewed source only to development branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/beta-0.2 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: player-first poster library, automatic discovery, verified ReShade deployment and A/B switching'
          git push origin HEAD:refs/heads/release/beta-0.2
