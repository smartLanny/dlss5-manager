name: Verify official ReShade source
on:
  push:
    branches: ['release/beta-0.2']
    paths: ['.github/workflows/verify-reshade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read official release metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, io, hashlib, json, struct
          url='https://reshade.me/downloads/ReShade_Setup_6.8.0_Addon.exe'
          req=urllib.request.Request(url, headers={'Referer':'https://reshade.me/','User-Agent':'DLSS5-Manager-Source-Verification'})
          with urllib.request.urlopen(req,timeout=45) as r:
              assert r.url == url
              b=r.read(32*1024*1024+1)
          assert len(b)<=32*1024*1024 and b[:2]==b'MZ'
          z=zipfile.ZipFile(io.BytesIO(b)); files=[]
          for n in ('ReShade64.dll','ReShade32.dll'):
              d=z.read(n); off=struct.unpack_from('<I',d,60)[0]
              files.append({'name':n,'size':len(d),'sha256':hashlib.sha256(d).hexdigest(),'machine':hex(struct.unpack_from('<H',d,off+4)[0]),'addonMarker':b'Searching for add-ons' in d})
          value={'version':'6.8.0','url':url,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'files':files,'zipEntries':z.namelist(),'firstLocalOffset':min(i.header_offset for i in z.infolist())}
          print(json.dumps(value,indent=2)); open('official-reshade-evidence.json','w').write(json.dumps(value,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-reshade-metadata
          path: official-reshade-evidence.json
          retention-days: 14
          if-no-files-found: error
