name: Windows Beta verification

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core:
    name: Core safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  windows:
    name: Windows x64 install and recovery
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm test
      - name: Real Electron UI and synthetic game install / rollback
        run: npm run test:ui
      - name: Build per-user setup and portable EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged application and generate release inventory
        run: node scripts/release-files.cjs
      - name: NSIS install path and packaged launch smoke
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-beta
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*-Setup.exe
            dist/*-Portable.exe
            dist/SHA256SUMS.txt
            dist/RELEASE-CONTENTS.json
            output/ui-home.png
            output/ui-versions.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-diagnostics
          retention-days: 7
          path: output/*.png

  release:
    name: Publish verified prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-beta
          path: release-artifacts
      - name: Publish Beta (never stable/latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          release-artifacts/dist/*-Setup.exe
          release-artifacts/dist/*-Portable.exe
          release-artifacts/dist/SHA256SUMS.txt
          release-artifacts/dist/RELEASE-CONTENTS.json
          release-artifacts/output/ui-home.png
          release-artifacts/output/ui-versions.png
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --prerelease --latest=false
          --title "装机宅 DLSS5 安装器 0.1 Beta"
          --notes-file docs/RELEASE-0.1-BETA.md
